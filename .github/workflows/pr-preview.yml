name: PR Preview Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup Keystore
    outputs:
      pr_number: ${{ steps.pr_info.outputs.pr_number }}
      pr_title: ${{ steps.pr_info.outputs.pr_title }}
      short_sha: ${{ steps.pr_info.outputs.short_sha }}
      release_tag: ${{ steps.pr_info.outputs.release_tag }}
      release_id: ${{ steps.create_release.outputs.release_id }} # Add release ID output
    steps:
      - name: Get PR info
        id: pr_info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "release_tag=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create keystore for release builds
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-file
          path: app/keystore.jks
          retention-days: 1

      - name: Delete existing draft release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="pr-${{ steps.pr_info.outputs.pr_number }}-${{ steps.pr_info.outputs.short_sha }}"

          # Check if release exists and delete it
          release_id=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$release_tag" | jq -r '.id // empty')

          if [ -n "$release_id" ]; then
            echo "Deleting existing release with ID: $release_id"
            curl -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
          fi

          # Delete the tag if it exists
          curl -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag" 2>/dev/null || true

      - name: Create draft release
        id: create_release # Add ID for output reference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="pr-${{ steps.pr_info.outputs.pr_number }}-${{ steps.pr_info.outputs.short_sha }}"
          pr_title="${{ steps.pr_info.outputs.pr_title }}"

          # Create release and capture response
          response=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"$release_tag\",
              \"target_commitish\": \"${{ github.event.pull_request.head.sha }}\",
              \"name\": \"PR #${{ steps.pr_info.outputs.pr_number }} Preview - $pr_title\",
              \"body\": \"Preview build for PR #${{ steps.pr_info.outputs.pr_number }}\\n\\nCommit: ${{ github.event.pull_request.head.sha }}\\n\\nThis is an automated draft release containing APK builds for testing.\",
              \"draft\": true,
              \"prerelease\": true
            }")

          # Parse release ID from response
          release_id=$(echo "$response" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" == "null" ]; then
            echo "::error::Failed to create release: $response"
            exit 1
          fi

          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "Created release $release_id"

  build-debug:
    needs: setup
    runs-on: ubuntu-latest
    name: Build Debug APK
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"
          cache: gradle

      - name: Update version for PR
        run: |
          # Get current version info
          current_code=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          current_name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)

          # Create PR-specific version
          pr_version_code=$((current_code + 9000 + ${{ needs.setup.outputs.pr_number }}))
          pr_version_name="$current_name-PR${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}"

          # Update build.gradle
          sed -i "s/versionCode $current_code/versionCode $pr_version_code/" app/build.gradle
          sed -i "s/versionName \"$current_name\"/versionName \"$pr_version_name\"/" app/build.gradle

          echo "Updated version to: $pr_version_name ($pr_version_code)"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename debug APK
        run: |
          pr_num=${{ needs.setup.outputs.pr_number }}
          sha=${{ needs.setup.outputs.short_sha }}
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/matscape-pr${pr_num}-${sha}-debug.apk

      - name: Upload Debug APK to Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file="app/build/outputs/apk/debug/matscape-pr${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}-debug.apk"

          # Use directly passed release ID
          release_id=${{ needs.setup.outputs.release_id }}

          # Upload APK as release asset
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk_file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=matscape-pr${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}-debug.apk"

  build-release:
    needs: [setup]
    runs-on: ubuntu-latest
    name: Build Release APK
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"
          cache: gradle

      - name: Download keystore
        uses: actions/download-artifact@v4
        with:
          name: keystore-file
          path: ./app

      - name: Update version for PR
        run: |
          # Get current version info
          current_code=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          current_name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)

          # Create PR-specific version
          pr_version_code=$((current_code + 9000 + ${{ needs.setup.outputs.pr_number }}))
          pr_version_name="$current_name-PR${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}"

          # Update build.gradle
          sed -i "s/versionCode $current_code/versionCode $pr_version_code/" app/build.gradle
          sed -i "s/versionName \"$current_name\"/versionName \"$pr_version_name\"/" app/build.gradle

          echo "Updated version to: $pr_version_name ($pr_version_code)"

      - name: Export signing environment variables
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename release APK
        run: |
          pr_num=${{ needs.setup.outputs.pr_number }}
          sha=${{ needs.setup.outputs.short_sha }}
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/matscape-pr${pr_num}-${sha}-release.apk

      - name: Upload Release APK to Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file="app/build/outputs/apk/release/matscape-pr${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}-release.apk"

          # Use directly passed release ID
          release_id=${{ needs.setup.outputs.release_id }}

          # Upload APK as release asset
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk_file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=matscape-pr${{ needs.setup.outputs.pr_number }}-${{ needs.setup.outputs.short_sha }}-release.apk"

  comment-pr:
    needs: [setup, build-debug, build-release]
    runs-on: ubuntu-latest
    name: Comment on PR
    if: always()
    steps:
      - name: Check build status
        id: build_status
        run: |
          debug_status="${{ needs.build-debug.result }}"
          release_status="${{ needs.build-release.result }}"

          if [[ "$debug_status" == "success" && "$release_status" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Both debug and release APKs built successfully!" >> $GITHUB_OUTPUT
          elif [[ "$debug_status" == "success" || "$release_status" == "success" ]]; then
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=⚠️ Partial build success. Check individual job results." >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Build failed. Please check the workflow logs." >> $GITHUB_OUTPUT
          fi

      - name: Get release assets info
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="${{ needs.setup.outputs.release_id }}"

          # Get release info with assets
          release_data=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$release_id")

          release_url=$(echo "$release_data" | jq -r '.html_url // empty')

          debug_url=""
          release_url_asset=""
          debug_size=""
          release_size=""

          if [ -n "$release_url" ]; then
            # Find debug APK
            debug_asset=$(echo "$release_data" | jq -r '.assets[] | select(.name | contains("debug")) | .browser_download_url, .size')
            if [ -n "$debug_asset" ]; then
              debug_url=$(echo "$debug_asset" | head -1)
              debug_size_bytes=$(echo "$debug_asset" | tail -1)
              debug_size=$(echo "$debug_size_bytes" | awk '{print ($1/1024/1024 > 1) ? sprintf("%.1f MB", $1/1024/1024) : sprintf("%.1f KB", $1/1024)}')
            fi
            
            # Find release APK
            release_asset=$(echo "$release_data" | jq -r '.assets[] | select(.name | contains("release")) | .browser_download_url, .size')
            if [ -n "$release_asset" ]; then
              release_url_asset=$(echo "$release_asset" | head -1)
              release_size_bytes=$(echo "$release_asset" | tail -1)
              release_size=$(echo "$release_size_bytes" | awk '{print ($1/1024/1024 > 1) ? sprintf("%.1f MB", $1/1024/1024) : sprintf("%.1f KB", $1/1024)}')
            fi
          fi

          echo "debug_url=$debug_url" >> $GITHUB_OUTPUT
          echo "release_url=$release_url_asset" >> $GITHUB_OUTPUT
          echo "draft_release_url=$release_url" >> $GITHUB_OUTPUT
          echo "debug_size=$debug_size" >> $GITHUB_OUTPUT
          echo "release_size=$release_size" >> $GITHUB_OUTPUT

      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { pr_number, short_sha } = ${{ toJson(needs.setup.outputs) }};
            const { status, message } = ${{ toJson(steps.build_status.outputs) }};
            const { debug_size, release_size, debug_url, release_url, draft_release_url } = ${{ toJson(steps.release_info.outputs) }};

            const debugStatus = "${{ needs.build-debug.result }}" === "success" ? "✅" : "❌";
            const releaseStatus = "${{ needs.build-release.result }}" === "success" ? "✅" : "❌";

            let downloadLinks = "";

            if (debug_url) {
              downloadLinks += `
            📱 **Debug APK** (${debug_size || 'Unknown size'})

            [📥 Download Debug APK](${debug_url}) 

            *Direct download - no ZIP extraction needed*
            `;
            } else if ("${{ needs.build-debug.result }}" === "success") {
              downloadLinks += `
            📱 **Debug APK** 

            ❌ Debug APK upload failed. Check workflow logs.
            `;
            }

            if (release_url) {
              downloadLinks += `
            🚀 **Release APK** (${release_size || 'Unknown size'})

            [📥 Download Release APK](${release_url}) 

            *Direct download - no ZIP extraction needed*
            `;
            } else if ("${{ needs.build-release.result }}" === "success") {
              downloadLinks += `
            🚀 **Release APK** 

            ❌ Release APK upload failed. Check workflow logs.
            `;
            }

            const body = `## 📦 PR Preview Build Results

            ${message}

            **Build Details:**
            - 🔨 Debug Build: ${debugStatus}
            - 🚀 Release Build: ${releaseStatus}
            - 📝 Commit: \`${short_sha}\`
            - 🔢 PR: #${pr_number}

            ## 📥 Direct Downloads

            ${downloadLinks}

            ${draft_release_url ? `🔗 **[View All Files in Draft Release](${draft_release_url})**` : ''}

            **🧪 Testing Notes:**
            - **Debug APK**: Includes debugging info, larger file size, easier to debug
            - **Release APK**: Optimized for production, smaller file size, final performance
            - Both APKs have special PR version numbers to avoid conflicts with production
            - APK names: \`matscape-pr${pr_number}-${short_sha}-[debug/release].apk\`

            **📱 Installation:**
            1. Click the download link above for direct APK download
            2. Enable "Install from unknown sources" on your Android device
            3. Install the downloaded APK
            4. Test the changes and provide feedback!

            **Note:** These downloads are stored in a draft release and will remain available until the PR is merged/closed

            ---

            🤖 *This comment was automatically generated by the PR Preview workflow*`;

            // Try to update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📦 PR Preview Build Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: body
              });
            }
