name: Build and Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '**/CONTRIBUTING.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup
    outputs:
      short_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get short SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create keystore
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Create play-services.json
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > app/play-services.json

      - name: Upload config files
        uses: actions/upload-artifact@v4
        with:
          name: config-files
          path: |
            app/keystore.jks
            app/play-services.json
          retention-days: 1

  version-check:
    needs: setup
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      short_sha: ${{ needs.setup.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Download config files
        uses: actions/download-artifact@v4
        with:
          name: config-files
          path: ./app

      - name: Get local versionCode
        id: local
        run: |
          code=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          echo "versionCode=$code" >> $GITHUB_OUTPUT

      - name: Get latest Play Store versionCode
        id: remote
        run: |
          python3 .github/scripts/check_playstore_version.py > playstore_output.txt
          version=$(grep "::set-output name=versionCode::" playstore_output.txt | cut -d ':' -f4)
          echo "versionCode=$version" >> $GITHUB_OUTPUT
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./app/play-services.json

      - name: Decide build or bump
        id: decision
        run: |
          LOCAL=${{ steps.local.outputs.versionCode }}
          REMOTE=${{ steps.remote.outputs.versionCode }}
          echo "Local: $LOCAL, Play Store: $REMOTE"

          if [ "$LOCAL" -gt "$REMOTE" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  update-version:
    needs: version-check
    if: needs.version-check.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    name: Update Version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump versionCode and versionName
        run: |
          code=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          new_code=$((code + 1))
          new_name="1.0-${{ needs.version-check.outputs.short_sha }}"

          sed -i "s/versionCode $code/versionCode $new_code/" app/build.gradle
          sed -i "s/versionName \"$name\"/versionName \"$new_name\"/" app/build.gradle

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version"
          git push

  build-apk:
    needs: [ update-version, version-check ]
    name: Build APK
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ needs.version-check.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle

      - name: Download configs
        uses: actions/download-artifact@v4
        with:
          name: config-files

      - name: Export signing env vars
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  build-aab:
    needs: [ update-version, version-check ]
    name: Build AAB
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ needs.version-check.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle

      - name: Download configs
        uses: actions/download-artifact@v4
        with:
          name: config-files
          path: ./app

      - name: Export signing env vars
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/play-services.json
          retention-days: 1

  publish:
    name: Publish to Play Store
    needs: [ build-apk, build-aab ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB (if any)
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./app

      - name: List files (debug)
        run: ls -R

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ByteMechanics.matscape
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          releaseName: Release ${{ needs.setup.outputs.short_sha }}
          whatsNewDirectory: whats-new/

  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get build artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./app

      - name: Get Last Tag
        id: get_last_tag
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --abbrev=0 --tags || echo "none")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT

      - name: Generate New Tag
        id: generate_new_tag
        run: |
          echo "new_tag=1.0-${{ needs.setup.outputs.short_sha }}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.generate_new_tag.outputs.new_tag }}
          name: "Release ${{ steps.generate_new_tag.outputs.new_tag }}"
          body: |
            ## What's Changed
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_last_tag.outputs.last_tag }}...${{ steps.generate_new_tag.outputs.new_tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk