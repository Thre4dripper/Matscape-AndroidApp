name: Build Apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get short SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create keystore
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Create google-services.json
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > app/play-services.json

      - name: Upload config files
        uses: actions/upload-artifact@v4
        with:
          name: config-files
          path: |
            app/keystore.jks
            app/play-services.json
          retention-days: 1

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle

      - name: Download config files
        uses: actions/download-artifact@v4
        with:
          name: config-files
          path: ./app

      - name: Change Gradle Wrapper Permissions
        run: chmod +x gradlew

      - name: Export signing env vars
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Bump App Version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "Bumping version from $VERSION_NAME ($VERSION_CODE) to 1.0-${{ needs.setup.outputs.short_sha }}"
          sed -i "s/versionCode $VERSION_CODE/versionCode $((VERSION_CODE + 1))/" app/build.gradle
          sed -i "s/versionName \"$VERSION_NAME\"/versionName \"1.0-${{ needs.setup.outputs.short_sha }}\"/" app/build.gradle

      - name: Build AAB with Gradle
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

  publish:
    name: Publish Release To Play Store
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Push to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ByteMechanics.matscape
          releaseFiles: app-release.aab
          track: production
          status: completed
          releaseName: Release ${{ needs.setup.outputs.short_sha }}
          whatsNewDirectory: whats-new/

