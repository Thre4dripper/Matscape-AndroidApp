name: matscape
description: "Matscape — matrix calculator"
publish_to: 'none'

# Versions are year.quarter.counter. The counter starts at the month of the
# quarter (November is 2026.4.2) and goes up by one with every release in
# that quarter, manual or automated. The build number is the same thing as
# one whole number: year, quarter, two-digit counter (2026.4.2 → 2026402).
# It must always be higher than the last one uploaded to the stores.
version: 2026.4.2+2026402

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  material_ui: ^1.1.0
  # Pure-Dart SVG path parser, used to draw the app's own icon set.
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No Material icon font: the app draws its own icons.
  uses-material-design: false
  fonts:
    - family: STIXTwoText
      fonts:
        - asset: assets/fonts/STIXTwoText.ttf
        - asset: assets/fonts/STIXTwoText-Italic.ttf
          style: italic
    # The maths symbols STIX Two Text doesn't have (√, ≤, →, ⋯ …), taken
    # from STIX Two Math so they look the same on every device.
    - family: STIXTwoMath
      fonts:
        - asset: assets/fonts/STIXTwoMath-Symbols.otf
    # Superscript letters such as the T of a transpose, which no STIX font
    # has. Taken from Noto Serif.
    - family: NotoSerifSuperscripts
      fonts:
        - asset: assets/fonts/NotoSerif-Superscripts.ttf
