name: matscape
description: "Matscape — matrix calculator"
publish_to: 'none'

# v1 (native Android) shipped up to build 21, so v2 continues from 22.
version: 2.0.0+22

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # Pure-Dart SVG path parser, used to draw the app's own icon set.
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No Material icon font: the app draws its own icons.
  uses-material-design: false
  fonts:
    - family: STIXTwoText
      fonts:
        - asset: assets/fonts/STIXTwoText.ttf
        - asset: assets/fonts/STIXTwoText-Italic.ttf
          style: italic
    # The maths symbols STIX Two Text doesn't have (√, ≤, →, ⋯ …), taken
    # from STIX Two Math so they look the same on every device.
    - family: STIXTwoMath
      fonts:
        - asset: assets/fonts/STIXTwoMath-Symbols.otf
    # Superscript letters such as the T of a transpose, which no STIX font
    # has. Taken from Noto Serif.
    - family: NotoSerifSuperscripts
      fonts:
        - asset: assets/fonts/NotoSerif-Superscripts.ttf
