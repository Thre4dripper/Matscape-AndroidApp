/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */

  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }

      { bg: 'dark', theme: 'light', app: { demo: 'inspect', m: 'A' },

        pops: [
          { x: -.12, y: big ? .34 : .4, rot: -3, html: '<div class="chip ok surface">' + CHECK + 'Symmetric</div>' },
          { x: -.06, y: big ? .42 : .48, rot: 2, html: '<div class="chip ok surface">' + CHECK + 'Positive definite</div>' },
          { x: -.1, y: big ? .5 : .56, rot: -2, html: '<div class="chip ok surface">' + CHECK + 'Invertible</div>' },
          { x: 1.1, y: big ? .2 : .24, rot: 3, right: true, html: '<div class="card surface"><span class="cap">Matrix A</span><div class="row"><span class="chip math" style="padding:0">tr = 12</span></div><div class="row"><span class="chip math" style="padding:0">rank 3</span></div></div>' }
        ] },
      { bg: 'light', theme: 'dark', app: { demo: 'solve', line: 2, method: '0:0' }, dark: true,
        h: 'Every step,<br><i>worked out.</i>', p: 'Choose your method. From matrix to answer, line by line.',
        pops: [
          { x: 1.12, y: land ? .2 : big ? .24 : .27, rot: 2, right: true, html: '<div class="segpop surface"><span class="on">Cofactor expansion</span><span>Row reduction</span></div>' },
          { x: -.1, y: land ? .5 : big ? .46 : .52, rot: -3, html: '<div class="card surface wcard"><span class="cap">Show the working</span><span class="wl"><i>M</i><sub>21</sub> = 1·5 − 2·0 = 5</span><span class="wl"><i>M</i><sub>22</sub> = 4·5 − 2·2 = 16</span></div>' },
          { x: 1.1, y: land ? .78 : big ? .66 : .74, rot: -2, right: true, html: '<div class="chip math surface answer">det = −1·5 + 3·16 = 43<span class="tag">Answer</span></div>' }
        ] },
      { bg: 'dark', theme: 'light', app: { kp: 'adv', active: 3 },
        h: 'Trig, eigenvalues,<br><i>SVD and more.</i>', p: 'A keypad built for matrices. No system keyboard in the way.',
        pops: [
          { x: -.12, y: .66, rot: -6, html: '<div class="key">eig</div>' },
          { x: 1.12, y: .7, rot: 5, right: true, html: '<div class="key">svd</div>' },
          { x: -.08, y: .8, rot: 4, html: '<div class="key">sin</div>' },
          { x: 1.09, y: .84, rot: -4, right: true, html: '<div class="key acc">expm</div>' },
          { x: -.14, y: .93, rot: -3, html: '<div class="key math"><span><i>A</i><sup>−1</sup></span></div>' }
        ] },
      { bg: 'light', theme: 'dark', devices: true, dark: true,
        h: big ? 'Built for <i>big screens</i><br>and foldables.' : 'Made for tablets<br><i>and foldables.</i>',
        p: 'Two panes when you unfold. Keypad below the fold in tabletop.' }
    ];

    var cfg = SETS[SET], sc = SCREENS[N - 1];
    var W = cfg.W, H = cfg.H, u = Math.min(W, H) / 1000;
    var root = document.documentElement.style;
    root.setProperty('--W', W); root.setProperty('--H', H); root.setProperty('--u', u);
    var canvas = document.getElementById('canvas');
    var pending = 0;
    function done() { if (--pending === 0) finish(); }
    /* Keep every floating element inside the safe area and clear of the headline,
       the other device and each other. Runs after fonts and frames are ready. */
    function layoutPops() {
      var cr = canvas.getBoundingClientRect(), mX = W * .05, mY = H * .03, gap = Math.min(W, H) * .016;
      var pops = Array.prototype.slice.call(canvas.querySelectorAll('.pop'));
      var box = function (el) { var r = el.getBoundingClientRect(); return { x: r.left - cr.left, y: r.top - cr.top, w: r.width, h: r.height }; };
      var hit = function (a, b) { return a.x < b.x + b.w + gap && b.x < a.x + a.w + gap && a.y < b.y + b.h + gap && b.y < a.y + a.h + gap; };
      var inside = function (r) { return r.x >= mX - 1 && r.x + r.w <= W - mX + 1 && r.y >= mY - 1 && r.y + r.h <= H - mY + 1; };
      var move = function (p, dx, dy) { p._dx = (p._dx || 0) + dx; p._dy = (p._dy || 0) + dy; p.style.setProperty('--dx', p._dx + 'px'); p.style.setProperty('--dy', p._dy + 'px'); };
      var copyEl = canvas.querySelector('.copy');
      var devs = Array.prototype.slice.call(canvas.querySelectorAll('.dev'));
      var blockers = function (p) {
        var list = [];
        if (copyEl) list.push(box(copyEl));
        devs.forEach(function (dv) { if (dv !== p.closest('.dev')) list.push(box(dv)); });
        pops.forEach(function (q) { if (q !== p) list.push(box(q)); });
        return list;
      };
      var clamp = function (p) {
        var r = box(p), dx = 0, dy = 0;
        if (r.x < mX) dx = mX - r.x; else if (r.x + r.w > W - mX) dx = W - mX - (r.x + r.w);
        if (r.y < mY) dy = mY - r.y; else if (r.y + r.h > H - mY) dy = H - mY - (r.y + r.h);
        if (dx || dy) move(p, dx, dy);
      };
      // Resolve one collision: try the four smallest escapes, keep the first that stays
      // inside the safe area and clear of everything else.
      var escape = function (p, o) {
        var r = box(p);
        var c = [[0, o.y + o.h + gap - r.y], [0, o.y - gap - (r.y + r.h)], [o.x + o.w + gap - r.x, 0], [o.x - gap - (r.x + r.w), 0]];
        c.sort(function (m, n) { return Math.abs(m[0]) + Math.abs(m[1]) - Math.abs(n[0]) - Math.abs(n[1]); });
        var others = blockers(p);
        for (var i = 0; i < c.length; i++) {
          var t = { x: r.x + c[i][0], y: r.y + c[i][1], w: r.w, h: r.h };
          if (inside(t) && !others.some(function (q) { return hit(t, q); })) { move(p, c[i][0], c[i][1]); return true; }
        }
        for (i = 0; i < c.length; i++) {
          t = { x: r.x + c[i][0], y: r.y + c[i][1], w: r.w, h: r.h };
          if (inside(t)) { move(p, c[i][0], c[i][1]); return true; }
        }
        return false;
      };
      pops.forEach(clamp);
      for (var pass = 0; pass < 10; pass++) {
        var moved = false;
        pops.forEach(function (p) {
          blockers(p).some(function (o) { if (hit(box(p), o)) { moved = escape(p, o) || moved; return true; } return false; });
        });
        pops.forEach(clamp);
        if (!moved) break;
      }
    }
    function finish() {
      var go = function () { setTimeout(function () { layoutPops(); requestAnimationFrame(function () { window.__ready = true; }); }, 1600); };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
    }
    function appSrc(d, app, theme) {
      var p = ['fresh=1', 'seed=showcase', 'shot=1', 'st=' + d.st, 'sb=' + d.sb, 'bar=' + (d.bar !== undefined ? d.bar : cfg.os), 'theme=' + theme];
      if (d.posture) p.push('posture=' + d.posture, 'hinge=' + d.hinge);
      Object.keys(app || {}).forEach(function (k) { p.push(k + '=' + encodeURIComponent(app[k])); });
      return '../app.html?' + p.join('&');
    }
    function device(d, k, x, y, app, theme, z) {
      var bz = Math.round(u * 16), sw = Math.round(d.w * k), sh = Math.round(d.h * k);
      var wrap = document.createElement('div');
      wrap.className = 'dev';
      wrap.style.cssText = 'left:' + x + 'px;top:' + y + 'px;--k:' + k + ';--bz:' + bz + 'px;--rr:' + Math.round(d.r * k) + 'px;--sw:' + sw + 'px;--sh:' + sh + 'px;' + (z ? 'z-index:' + z : '');
      var cam = d.cam || cfg.dev && cfg.dev.cam && !d.posture ? (d.cam || cfg.dev.cam) : '';
      var tb = d.chrome === 'window' ? '<div class="titlebar" aria-hidden="true"><span class="ti"></span><span>Matscape</span><span class="sp"></span><span class="wc min"></span><span class="wc"></span><span class="wc"></span></div>' : '';
      wrap.innerHTML = '<div class="device' + (d.chrome === 'window' ? ' window' : '') + '">' + tb + '<div class="screen"><iframe width="' + d.w + '" height="' + d.h + '" style="width:' + d.w + 'px;height:' + d.h + 'px;transform:scale(' + k + ')" title="Matscape app screen" src="' + appSrc(d, app, theme) + '"></iframe>' +
        (cam ? '<span class="' + cam + '" aria-hidden="true"></span>' : '') + (d.crease ? '<span class="crease ' + d.crease + '" aria-hidden="true"></span>' : '') + '</div></div>';
      pending++;
      wrap.querySelector('iframe').addEventListener('load', done);
      canvas.appendChild(wrap);
      var outW = sw + 2 * bz;
      wrap.style.setProperty('--pu', Math.min(outW / 800, W / 1100, H / 1100));
      return { el: wrap, w: outW, h: sh + 2 * bz + (d.chrome === 'window' ? Math.round(34 * k) : 0) };
    }
    function fit(d, maxW, maxH) { var bz = Math.round(u * 16); return Math.min((maxW - 2 * bz) / d.w, (maxH - 2 * bz) / (d.h + (d.chrome === 'window' ? 34 : 0))); }
    function addPops(devBox, pops, darkPops) {
      (pops || []).forEach(function (pp) {
        var el = document.createElement('div');
        el.className = 'pop' + (darkPops ? ' pop-dark' : '');
        el.style.setProperty('--u', pp.u ? String(pp.u) : 'var(--pu)');
        el.style.left = pp.x * 100 + '%';
        el.style.top = pp.y * 100 + '%';
        el.style.setProperty('--rot', (pp.rot || 0) + 'deg');
        if (pp.right) el.style.setProperty('--tx', '-100%');
        el.setAttribute('aria-hidden', 'true');
        el.innerHTML = pp.html;
        devBox.el.appendChild(el);
      });
    }

    canvas.className = 'canvas ' + (cfg.feature ? 'dark feature' : sc.bg + (cfg.land ? ' landscape' : ' portrait'));
    pending++;

    if (cfg.feature) {
      canvas.innerHTML = '<div class="copy"><div class="brandrow"><img src="../brand/icon/icon.svg" alt=""><div class="wordmark">Mat<i>scape</i></div></div><p>Every matrix tool. One elegant workspace.</p><small>For phones, tablets and foldables</small></div>';
      var fd = { w: 412, h: 915, st: 40, sb: 24, r: 40, cam: 'punch' };
      var fk = 0.7, fb = device(fd, fk, 640, 64, { active: 0 }, 'light');
      addPops(fb, [{ x: -.18, y: .34, rot: -4, html: '<div class="card surface" style="--u:.62"><span class="lbl">A</span>' + mx([['4', '1', '2'], ['1', '3', '0'], ['2', '0', '5']], 34) + '</div>' }]);
    } else {
      var copy = document.createElement('div');
      copy.className = 'copy';
      copy.style.setProperty('--hs', cfg.hs); copy.style.setProperty('--ps', cfg.ps);
      if (!cfg.land) copy.style.top = cfg.copyTop * H + 'px';
      copy.innerHTML = '<h1>' + sc.h + '</h1><p>' + sc.p + '</p>';
      canvas.appendChild(copy);

      if (!sc.devices) {
        var d = cfg.dev, k, x, y, box;
        if (cfg.land) {
          var rx0 = cfg.regionX[0] * W, rx1 = cfg.regionX[1] * W, ry0 = cfg.region[0] * H, ry1 = cfg.region[1] * H;
          k = fit(d, rx1 - rx0, ry1 - ry0);
          var bw = d.w * k + 2 * Math.round(u * 16), bh = (d.h + (d.chrome === 'window' ? 34 : 0)) * k + 2 * Math.round(u * 16);
          x = rx0 + (rx1 - rx0 - bw) / 2; y = ry0 + (ry1 - ry0 - bh) / 2;
        } else {
          var top = cfg.region[0] * H, bottom = cfg.region[1] * H;
          k = fit(d, cfg.maxW * W, bottom - top);
          x = (W - (d.w * k + 2 * Math.round(u * 16))) / 2; y = top;
        }
        box = device(d, k, Math.round(x), Math.round(y), sc.app, sc.theme);
        addPops(box, sc.pops, sc.dark);
      } else {
        var pair = FOLD[cfg.os], a = pair[0], b = pair[1];
        if (cfg.land) {
          var L0 = cfg.regionX[0] * W, L1 = cfg.regionX[1] * W, T0 = cfg.region[0] * H, T1 = cfg.region[1] * H;
          var ka = fit(a, (L1 - L0) * .66, (T1 - T0));
          var ba = device(a, ka, Math.round(L0), Math.round(T0 + ((T1 - T0) - (a.h * ka + 2 * Math.round(u * 16))) / 2), { active: 0 }, 'dark');
          var kb = fit(b, (L1 - L0) * .42, (T1 - T0) * .9);
          var bbw = b.w * kb + 2 * Math.round(u * 16), bbh = b.h * kb + 2 * Math.round(u * 16);
          var bb = device(b, kb, Math.round(L1 - bbw), Math.round(T1 - bbh), { active: 1 }, 'light', 4);
          addPops(ba, [{ x: .04, y: -.04, rot: -2, u: u * .9, html: '<div class="chip note surface">Unfolded · two panes</div>' }], true);
          addPops(bb, [{ x: 1.02, y: 1.05, rot: 2, right: true, u: u * .9, html: '<div class="chip note surface">Tabletop · keypad below the fold</div>' }], false);
        } else {
          var top2 = cfg.region[0] * H, bottom2 = cfg.region[1] * H, rh = bottom2 - top2;
          var ka2 = fit(a, W * .86, rh * .6);
          var aw = a.w * ka2 + 2 * Math.round(u * 16);
          var ba2 = device(a, ka2, Math.round((W - aw) / 2 - W * .04), Math.round(top2), { active: 0 }, 'dark');
          var kb2 = fit(b, W * .56, rh * .56);
          var bw2 = b.w * kb2 + 2 * Math.round(u * 16), bh2 = b.h * kb2 + 2 * Math.round(u * 16);
          var bb2 = device(b, kb2, Math.round(W * .955 - bw2), Math.round(bottom2 - bh2), { active: 1 }, 'light', 4);
          addPops(ba2, [{ x: .03, y: 1.07, rot: -2, u: u * .9, html: '<div class="chip note surface">Unfolded · two panes</div>' }], true);
          addPops(bb2, [{ x: -.06, y: .3, rot: 3, right: true, u: u * .9, html: '<div class="chip note surface">Tabletop · keypad<br>below the fold</div>' }], false);
        }
      }
    }
    done();
  })();
  </script>
