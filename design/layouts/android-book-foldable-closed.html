<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matscape · Book foldable — Closed · Compact · narrow cover screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" />
  <style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

    :root {
      --stage: #e8ebef; --ink: #12151a; --ink-2: #434a55; --ink-3: #5f6773; --line: #d3d8df; --surface: #ffffff;
      --accent: #1f43c9; --accent-ink: #1a39ad; --accent-soft: #e2e8fb; --bezel: #16171a;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
      --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
      --w: 368px; --h: 850px; --bz: 9px; --r: 36px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--stage); color: var(--ink); font: 16px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent-ink); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .bar .od-field { flex: 1 1 320px; }
    .bar h1 { margin: 0; font-family: var(--font-math); font-weight: 600; font-size: 24px; line-height: 1.25; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 14px; color: var(--ink-2); }
    .tag { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 650; white-space: nowrap; }
    .desc { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); max-width: 72ch; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; }
    .nav a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; }
    @media (hover: hover) { .nav a:hover { border-color: var(--accent); color: var(--accent-ink); } }
    .stage { display: grid; place-items: center; padding: 32px 24px 48px; min-height: 0; }
    .device { padding: var(--bz); border-radius: calc(var(--rs) + var(--bz)); background: var(--bezel);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 32px 56px -24px rgba(10,12,16,.45), 0 10px 22px -12px rgba(10,12,16,.3); }
    .screen { position: relative; overflow: hidden; width: var(--sw); height: var(--sh); border-radius: var(--rs); background: #f6f7f9; }
    .screen iframe { position: absolute; top: 0; left: 0; width: var(--w); height: var(--h); border: 0; transform-origin: 0 0; transform: scale(var(--s)); background: #f6f7f9; }
    .crease { position: absolute; pointer-events: none; }
    .crease--v { top: 0; bottom: 0; left: 50%; width: 12px; margin-left: -6px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.07) 45%, rgba(255,255,255,.06) 55%, transparent); }
    .crease--h, .crease--h-soft { left: 0; right: 0; top: 50%; height: 12px; margin-top: -6px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.07) 45%, rgba(255,255,255,.06) 55%, transparent); }
    .crease--h-soft { opacity: .5; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="od-field">
      <h1>Book foldable — Closed</h1>
      <div class="meta"><span class="tag">Compact · narrow cover screen</span><span>Android · sizes approximate</span></div>
      <p class="desc">A tall, narrow cover screen still gets the full single-column app.</p>
    </div>
    <nav class="nav" aria-label="Layouts">
      <a href="android-phone-compact.html" aria-label="Previous layout: Android phone, portrait">← Android phone · Portrait</a>
      <a href="../devices.html">All devices</a>
      <a href="android-book-foldable-open.html" aria-label="Next layout: Book foldable, open">Book foldable · Open →</a>
    </nav>
  </header>
  <main class="stage">
    <div class="device">
      <div class="screen">
        <iframe src="../app.html?st=36&sb=24&bar=android" title="Matscape on Book foldable, closed — Compact · narrow cover screen layout"></iframe>
        
      </div>
    </div>
  </main>
  <script>
    (function () {
      var W = 368, H = 850, BZ = 9, R = 36, root = document.documentElement.style;
      function fit() {
        var bar = document.querySelector('.bar').offsetHeight;
        var s = Math.min(1, (window.innerWidth - 48 - 2 * BZ) / W, (window.innerHeight - bar - 80 - 2 * BZ) / H);
        s = Math.max(0.25, s);
        root.setProperty('--s', s);
        root.setProperty('--sw', Math.round(W * s) + 'px');
        root.setProperty('--sh', Math.round(H * s) + 'px');
        root.setProperty('--rs', Math.round(R * s) + 'px');
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
  <script src="../app/board-theme.js"></script>
</body>
</html>
