<!doctype html>
<!-- Matscape 2 — standalone adaptive app. Fills whatever window or frame it is
     given and picks its layout from the available width. Optional query:
     posture=book|tabletop|glance · st / sb = top / bottom safe area (px) ·
     hinge = fold gap (px) · bar=ios|android draws a status bar ·
     sl / sr = left / right safe area (px, phones on their side) ·
     strip=left|right = an 84pt system strip down that side (iPhone Duo outer
     screen) that holds the status items and the matrices. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matscape</title>
  <style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

    :root { --phone-safe-top: 0px; --phone-safe-bottom: 0px; --phone-safe-left: 0px; --phone-safe-right: 0px; --hinge: 24px; }
    html, body { margin: 0; height: 100%; }
    body { overflow: hidden; background: var(--phone-screen-bg, #f6f7f9); }
    .screen-host { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: var(--phone-screen-bg, #f6f7f9); }
    .phone-content { position: absolute; inset: 0; box-sizing: border-box; overflow: hidden; padding: var(--phone-safe-top) var(--phone-safe-right) var(--phone-safe-bottom) var(--phone-safe-left); }
    /* status items inside the side strip (iPhone Duo outer screen) */
    .sstrip {
      position: absolute; z-index: 15; top: 0; width: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px;
      padding-bottom: 14px; color: var(--phone-system-fg, #111317); pointer-events: none;
      font: 600 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Noto Sans", system-ui, sans-serif;
    }
    .sstrip[data-side="left"] { left: 0; } .sstrip[data-side="right"] { right: 0; }
    .sstrip .icons { display: inline-flex; align-items: center; gap: 5px; }
    .sstrip svg { display: block; flex: none; fill: currentColor; width: 16px; height: 11px; }
    .sstrip svg.battery { width: 24px; }
    .sbar {
      position: absolute; z-index: 15; top: 0; left: 0; right: 0; box-sizing: border-box;
      height: var(--phone-safe-top); display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
      color: var(--phone-system-fg, #111317); pointer-events: none;
      font: 600 14px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Noto Sans", system-ui, sans-serif;
    }
    .sbar[data-os="ios"] { font-size: 15px; }
    .sbar .icons { display: inline-flex; align-items: center; gap: 6px; }
    .sbar svg { display: block; flex: none; fill: currentColor; width: 17px; height: 11px; }
    .sbar svg.battery { width: 25px; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" />
  <link rel="stylesheet" href="app/app.css" />
</head>
<body>
  <section class="screen-host" data-phone-screen>
    <main class="phone-content" data-phone-content>
      <div class="app" id="app"></div>
    </main>
    <div class="sbar" id="sbar" hidden aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><path d="M1 10.5h2V8H1v2.5Zm4 0h2V5.5H5v5Zm4 0h2V3H9v7.5Zm4 0h2V.5h-2v10Z"/></svg>
        <svg viewBox="0 0 18 12"><path d="M9 11.2 7.2 9.4a2.55 2.55 0 0 1 3.6 0L9 11.2Zm4.1-4.1-1.35 1.35a3.9 3.9 0 0 0-5.5 0L4.9 7.1a5.8 5.8 0 0 1 8.2 0Zm3-3-1.35 1.35a8.15 8.15 0 0 0-11.5 0L1.9 4.1a10.05 10.05 0 0 1 14.2 0Z"/></svg>
        <svg class="battery" viewBox="0 0 27 12"><path fill-rule="evenodd" d="M2.5 1h19A2.5 2.5 0 0 1 24 3.5v5a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 0 8.5v-5A2.5 2.5 0 0 1 2.5 1Zm0 1A1.5 1.5 0 0 0 1 3.5v5A1.5 1.5 0 0 0 2.5 10h19A1.5 1.5 0 0 0 23 8.5v-5A1.5 1.5 0 0 0 21.5 2h-19Zm.5 1h17.5A1.5 1.5 0 0 1 22 4.5v3A1.5 1.5 0 0 1 20.5 9H3V3Zm22 1.5a1.5 1.5 0 0 1 0 3v-3Z"/></svg>
      </span>
    </div>
    <div class="sstrip" id="sstrip" hidden aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><path d="M9 11.2 7.2 9.4a2.55 2.55 0 0 1 3.6 0L9 11.2Zm4.1-4.1-1.35 1.35a3.9 3.9 0 0 0-5.5 0L4.9 7.1a5.8 5.8 0 0 1 8.2 0Zm3-3-1.35 1.35a8.15 8.15 0 0 0-11.5 0L1.9 4.1a10.05 10.05 0 0 1 14.2 0Z"/></svg>
      </span>
    </div>
  </section>
  <script>
    (function () {
      var q = new URLSearchParams(location.search), root = document.documentElement.style;
      function num(k, d) { var v = parseFloat(q.get(k)); return isFinite(v) ? v : d; }
      var st = num('st', 0);
      root.setProperty('--phone-safe-top', st + 'px');
      root.setProperty('--phone-safe-bottom', num('sb', 0) + 'px');
      root.setProperty('--hinge', num('hinge', 24) + 'px');
      root.setProperty('--phone-safe-left', num('sl', 0) + 'px');
      root.setProperty('--phone-safe-right', num('sr', 0) + 'px');
      var strip = q.get('strip'), ss = document.getElementById('sstrip');
      if (strip === 'left' || strip === 'right') {
        ss.hidden = false; ss.setAttribute('data-side', strip);
        // upright, the status items take the top of the strip; on its side, a shorter band
        ss.style.height = (window.innerHeight > window.innerWidth ? 164 : 76) + 'px';
        if (window.innerHeight <= window.innerWidth) { ss.style.paddingBottom = '10px'; ss.style.gap = '6px'; }
      }
      var bar = q.get('bar'), el = document.getElementById('sbar');
      if (bar && st >= 20) { el.hidden = false; el.setAttribute('data-os', bar); }
    })();
  </script>
  <script src="app/engine.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
